# Grants the OpenShift Pipelines "pipeline" service account permission to
# apply k8s/ manifests and restart the Deployment in this project.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mrp-pipeline-edit
  labels:
    app.kubernetes.io/part-of: mrp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: pipeline
