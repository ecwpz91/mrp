<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>Mars Rover Photos — Rover</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="/css/shards.min.css">
	<link rel="stylesheet" href="/css/mrp.css">
</head>
<body class="mrp-body">
	<header class="mrp-header">
		<div class="mrp-header__inner">
			<img class="mrp-header__logo" alt="NASA logo" src="/images/logo.png" width="104" height="104">
			<h1 class="mrp-header__title">Mars Rover Photos</h1>
		</div>
	</header>

	<main class="mrp-main">
		<nav class="mrp-nav" aria-label="Page">
			<a href="/rovers">← Back to Rovers</a>
			<a href="/">Home</a>
		</nav>

		{#if !rover}
		<h2 class="mrp-page-title">No Rover found</h2>
		<p class="mrp-empty">That rover could not be loaded.</p>
		{#else}
		<h2 class="mrp-page-title">Rover Details</h2>
		<div class="mrp-simple-table-wrap">
			<table class="mrp-simple-table">
				<thead>
					<tr>
						<th scope="col">ID</th>
						<th scope="col">Name</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>{rover.id}</td>
						<td>{rover.name}</td>
					</tr>
				</tbody>
			</table>
		</div>
		{/if}
	</main>

	<footer class="mrp-footer">
		MRP Image Management Tool &copy;
		<a href="http://msurbey.com" target="_blank" rel="noopener noreferrer">Michael Surbey</a>
	</footer>
</body>
</html>
