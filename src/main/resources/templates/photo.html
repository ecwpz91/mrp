<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Mars Rover Photos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
    integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/shards.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    #trek-map {
      width: 400px;
      height: 300px;
      margin: 0 auto;
    }
    .trek-caption {
      max-width: 420px;
      margin: 0.5rem auto 0;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <table style="background-color: gray;">
    <tr style="width: 100%">
      <td style="width: 1%">
        <img alt="nasa logo" src="../images/logo.png" height="150px;">
      </td>
      <td style="width: 55%" align="left">
        <h2>Welcome to Mars Rover Photos, an Image Management Tool</h2>
      </td>
    </tr>
  </table>

  <div align="center" style="min-height: 400px; padding-bottom: 2rem;">
    <p style="margin: 1rem 0;">
      <a th:href="@{/rovers}" target="_self">← Back to Rovers</a>
      &nbsp;|&nbsp;
      <a th:href="@{/}" target="_self">Home</a>
    </p>
    <div th:switch="${photo}">
      <h2 th:case="null">No Photo found!</h2>
      <div th:case="*">
        <h2>Photo Details</h2>
        <table border="1">
          <thead>
            <tr>
              <th>ID</th>
              <th>Photo</th>
              <th>Earth Date</th>
              <th>Sol</th>
              <th>Camera</th>
              <th>Rover</th>
              <th>Orbital context</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td th:text="${photo.id}"></td>
              <td>
                <a th:href="${photo.imgSrc}">
                  <img alt="Mars rover photo" th:src="${photo.imgSrc}" width="500" height="300" />
                </a>
              </td>
              <td th:text="${photo.earthDate}"></td>
              <td th:text="${photo.sol}"></td>
              <td>
                <span th:if="${photo.camera != null}"
                  th:text="|${photo.camera.name} — ${photo.camera.fullName}|"></span>
              </td>
              <td>
                <span th:if="${photo.rover != null}" th:text="${photo.rover.name}"></span>
              </td>
              <td th:if="${trek != null}">
                <div id="trek-map"
                  th:attr="data-tile-url=${trek.tileUrlTemplate},
                           data-center-lat=${trek.centerLat},
                           data-center-lon=${trek.centerLon},
                           data-min-lat=${trek.minLat},
                           data-min-lon=${trek.minLon},
                           data-max-lat=${trek.maxLat},
                           data-max-lon=${trek.maxLon},
                           data-layer-title=${trek.layerTitle}"></div>
                <p class="trek-caption"
                  th:text="|Landing-site orbital mosaic (not the rover's exact position on ${photo.earthDate} / sol ${photo.sol}). ${trek.layerTitle}|"></p>
                <p class="trek-caption">
                  <a th:href="${trek.exploreUrl}" target="_blank" rel="noopener noreferrer">Open in Mars Trek</a>
                </p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function () {
      var el = document.getElementById('trek-map');
      if (!el || typeof L === 'undefined') {
        return;
      }

      var tileUrl = el.getAttribute('data-tile-url');
      var centerLat = parseFloat(el.getAttribute('data-center-lat'));
      var centerLon = parseFloat(el.getAttribute('data-center-lon'));
      var minLat = parseFloat(el.getAttribute('data-min-lat'));
      var minLon = parseFloat(el.getAttribute('data-min-lon'));
      var maxLat = parseFloat(el.getAttribute('data-max-lat'));
      var maxLon = parseFloat(el.getAttribute('data-max-lon'));
      var layerTitle = el.getAttribute('data-layer-title') || 'Mars Trek';

      var map = L.map(el, {
        crs: L.CRS.EPSG4326,
        worldCopyJump: false
      });

      L.tileLayer(tileUrl, {
        attribution: 'NASA / JPL Mars Trek',
        maxZoom: 12,
        minZoom: 0,
        tms: false,
        noWrap: true
      }).addTo(map);

      var bounds = L.latLngBounds(
        L.latLng(minLat, minLon),
        L.latLng(maxLat, maxLon)
      );
      map.fitBounds(bounds, { padding: [12, 12], maxZoom: 8 });
      L.marker([centerLat, centerLon]).addTo(map).bindPopup(layerTitle);
    })();
  </script>
</body>

</html>
