# Prefer: export MARSVISTA_API_KEY=your-key
# Or run with -Dquarkus.profile=local and application-local.properties (gitignored).
api.key=${MARSVISTA_API_KEY:api-key-here}

quarkus.application.name=mrp
quarkus.http.port=8080

# Mars Vista REST client
quarkus.rest-client.mars-vista.url=https://api.marsvista.dev
quarkus.rest-client.mars-vista.scope=jakarta.inject.Singleton

# NASA Image and Video Library (no API key)
quarkus.rest-client.nasa-images.url=https://images-api.nasa.gov
quarkus.rest-client.nasa-images.scope=jakarta.inject.Singleton

# Health & metrics
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-health.root-path=/q/health

# Qute
quarkus.qute.strict-rendering=false
